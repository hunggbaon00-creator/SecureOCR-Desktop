[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secureocr-desktop"
version = "0.1.0"
description = "Windows desktop workbench for local OCR, summarization, and sensitive-content review"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "PySide6==6.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.8",
]

[project.scripts]
secureocr-desktop = "secureocr_desktop.main:main"

[tool.setuptools.packages.find]
include = ["secureocr_desktop*"]

[tool.setuptools.package-data]
secureocr_desktop = ["resources/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
